[package]
name = "onebarrier"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Transparent passive fault tolerance as a byproduct of total-order communication (built on the 1Pipe fabric)."
authors = ["Bojie Li <boj@19pine.ai>"]
repository = "https://github.com/19PINE-AI/OneBarrier"
homepage = "https://01.me/research/OneBarrier"
readme = "../../README.md"
keywords = ["fault-tolerance", "distributed-systems", "deterministic-replay"]
categories = ["network-programming"]
publish = false

# Pin the public 1Pipe reproduction so a fresh checkout builds without a sibling
# repository and remains reproducible if 1Pipe's default branch changes.
[dependencies]
onepipe-core = { git = "https://github.com/bojieli/1Pipe.git", rev = "01b307861bc608f758b9297147688b84f90580c5" }
onepipe-net = { git = "https://github.com/bojieli/1Pipe.git", rev = "01b307861bc608f758b9297147688b84f90580c5" }

[dev-dependencies]

[[bin]]
name = "ob-demo"
path = "src/bin/ob_demo.rs"

[[bin]]
name = "ob-bench"
path = "src/bin/ob_bench.rs"

